        // --- AUTH FUNCTIONS ---
        function handleLogin(type) {

        function navigate(pageId) {
            currentPage = pageId;
            document.getElementById('page-title').innerText = pageId.replace(/_/g, ' ');
            
            // Close mobile sidebar on navigation
            const sidebar = document.getElementById('sidebar');

            overlay.classList.add('hidden');

            document.querySelectorAll('.nav-btn').forEach(btn => {
                if (btn.getAttribute('data-page') === pageId) {
                    btn.classList.add('bg-emerald-50', 'text-emerald-700', 'font-bold');
                    btn.classList.remove('text-gray-500');
                } else {
                    btn.classList.remove('bg-emerald-50', 'text-emerald-700', 'font-bold');

                }
            });

            renderPage();
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            if (sidebar.classList.contains('closed')) {
                sidebar.classList.remove('closed');
                overlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('closed');
                overlay.classList.add('hidden');
            }

        // --- TOAST SYSTEM (SOCIALLY HARMONIOUS & CLEAN) ---
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const bgClasses = {
                success: 'bg-emerald-600 border-emerald-500 text-white',
                danger: 'bg-rose-600 border-rose-500 text-white',
                info: 'bg-slate-800 border-slate-700 text-white',
                warning: 'bg-amber-500 border-amber-400 text-slate-900'
            };

            const iconMap = {
                success: 'check-circle-2',
                danger: 'alert-triangle',
                info: 'info',
                warning: 'alert-circle'
            };

            toast.className = `flex items-center gap-3 px-5 py-3 rounded-2xl shadow-lg border text-sm font-semibold transition-all duration-300 transform translate-y-2 opacity-0 pointer-events-auto ${bgClasses[type]}`;
            toast.innerHTML = `
                <i data-lucide="${iconMap[type]}" class="w-5 h-5 shrink-0"></i>
                <span>${message}</span>
            `;

            container.appendChild(toast);
            lucide.createIcons();

            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 50);

            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => {
                    toast.remove();
                }, 300);
            }, 3000);
        }

        // --- GRADE CALCULATOR HELPER ---
        function calculateGrade(score) {
            if (score === null || score === undefined || score === '') return { grade: '-', color: 'text-gray-400', label: 'Belum Dinilai' };
            const num = parseFloat(score);
            if (num >= 80) return { grade: 'A', color: 'text-emerald-600 bg-emerald-50 border-emerald-200', label: 'Cemerlang' };
            if (num >= 65) return { grade: 'B', color: 'text-cyan-600 bg-cyan-50 border-cyan-200', label: 'Baik' };
            if (num >= 50) return { grade: 'C', color: 'text-amber-600 bg-amber-50 border-amber-200', label: 'Memuaskan' };
            if (num >= passGradeThreshold) return { grade: 'D', color: 'text-orange-600 bg-orange-50 border-orange-200', label: 'Mencapai Minimum' };
            return { grade: 'F', color: 'text-rose-600 bg-rose-50 border-rose-200', label: 'Belum Mencapai Tahap Minimum' };
        }

        // --- CORE APPLICATION BUSINESS LOGIC ---
        
        // Save Individual Mark
        function saveIndividualMark(studentId, score) {
            const subject = document.getElementById('filter-subject').value;
            const type = document.getElementById('filter-assessment').value;
            const scoreVal = score.trim();
            
            if (scoreVal !== '' && (isNaN(scoreVal) || parseFloat(scoreVal) < 0 || parseFloat(scoreVal) > 100)) {
                showToast('Markah mestilah berada di antara 0 hingga 100.', 'danger');
                return;
            }

            const key = `${studentId}_${type}_${subject}`;
            if (scoreVal === '') {
                delete studentMarks[key];
            } else {
                studentMarks[key] = parseFloat(scoreVal);
            }
            showToast('Markah berjaya disimpan secara setempat.', 'success');
            renderPage();
        }

        // Bulk Save Marks for Class Page
        function saveBulkMarks() {
            const inputs = document.querySelectorAll('.mark-input');
            const subject = document.getElementById('filter-subject').value;
            const type = document.getElementById('filter-assessment').value;
            let count = 0;

            inputs.forEach(input => {
                const studentId = input.getAttribute('data-student-id');
                const val = input.value.trim();
                const key = `${studentId}_${type}_${subject}`;

                if (val !== '') {
                    const num = parseFloat(val);
                    if (!isNaN(num) && num >= 0 && num <= 100) {
                        studentMarks[key] = num;
                        count++;
                    }
                } else {
                    delete studentMarks[key];
                }
            });

            showToast(`Berjaya mengemas kini ${count} rekod markah murid.`, 'success');
            renderPage();
        }

        // Add Student
        function addStudent(event) {
            event.preventDefault();
            const nameInput = document.getElementById('new-student-name');
            const classSelect = document.getElementById('new-student-class');
            
            if (!nameInput.value.trim()) {
                showToast('Sila masukkan nama murid.', 'warning');
                return;
            }

            const newId = students.length > 0 ? Math.max(...students.map(s => s.id)) + 1 : 1;
            students.push({
                id: newId,
                nama: nameInput.value.trim(),
                kelas: classSelect.value
            });

            nameInput.value = '';
            showToast('Murid baru berjaya ditambahkan ke dalam pangkalan data!', 'success');
            renderPage();
        }

        // Delete Student
        function deleteStudent(id) {
            const idx = students.findIndex(s => s.id === id);
            if (idx !== -1) {
                const studentName = students[idx].nama;
                students.splice(idx, 1);
                
                // Clear any associated marks
                for (const key in studentMarks) {
                    if (key.startsWith(`${id}_`)) {
                        delete studentMarks[key];
                    }
                }
                
                showToast(`Murid ${studentName} telah dipadamkan.`, 'info');
                renderPage();
            }
        }

                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>`;
            }

            // 4. PENTAKSIRAN 1 & UASA (ADMIN ONLY REPORT)
            else if (currentPage === 'pentaksiran_1' || currentPage === 'uasa') {
                const type = currentPage === 'pentaksiran_1' ? 'pentaksiran_1' : 'uasa';
                const currentSelectedClass = selectedFilterClass;
                const filteredStudents = students.filter(s => s.kelas === currentSelectedClass);

                let headerSubjectsHTML = subjects.map(sub => `<th class="p-4 text-center">${sub.name}</th>`).join('');

                let rows = filteredStudents.map(s => {
                    let subjectCells = subjects.map(sub => {
                        const score = studentMarks[`${s.id}_${type}_${sub.code}`];
                        if (score === undefined) {
                            return `<td class="p-4 text-center text-gray-400 font-medium italic">-</td>`;
                        }
                        const gradeInfo = calculateGrade(score);
                        return `
                        <td class="p-4 text-center">
                            <span class="block text-sm font-bold text-gray-800">${score}%</span>
                            <span class="text-[10px] font-black px-1.5 py-0.5 rounded border ${gradeInfo.color}">${gradeInfo.grade}</span>
                        </td>`;
                    }).join('');

                    return `
                    <tr class="hover:bg-slate-50 border-b border-gray-100 transition-colors">
                        <td class="p-4 text-sm font-bold text-gray-800 uppercase">${s.nama}</td>
                        ${subjectCells}
                    </tr>`;
                }).join('');

                if (rows.length === 0) {
                    rows = `<tr><td colspan="${subjects.length + 1}" class="p-8 text-center text-gray-400 font-medium">Tiada rekod murid berdaftar dalam kelas ini.</td></tr>`;
                }

                container.innerHTML = `
                <div class="space-y-6">
                    <!-- Filters and Export Actions -->
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-emerald-50 flex flex-wrap gap-4 items-center justify-between">
                        <div class="flex items-center gap-3">
                            <label class="text-xs font-bold text-gray-400 uppercase tracking-wider">Pilih Kelas:</label>
                            <select id="filter-class" onchange="updateFilters()" class="bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl px-4 py-2 text-sm font-bold border-none outline-none cursor-pointer">
                                ${classes.map(cls => `<option value="${cls}" ${currentSelectedClass === cls ? 'selected' : ''}>Tahun ${cls}</option>`).join('')}
                            </select>
                        </div>
                        <button onclick="window.print()" class="bg-slate-800 hover:bg-slate-900 text-white px-5 py-2 rounded-xl font-bold text-sm flex items-center gap-2 transition-all shadow-md">
                            <i data-lucide="printer" class="w-4 h-4"></i> Cetak Laporan Kelas
                        </button>
                    </div>

                    <!-- Grade Distribution Analysis Charts -->
                    <div class="bg-white rounded-2xl shadow-sm border border-emerald-50 overflow-hidden">
                        <div class="p-6 border-b border-emerald-50 bg-emerald-50/10">
                            <h4 class="font-bold text-gray-800 text-lg flex items-center gap-2">
                                <i data-lucide="bar-chart-2" class="text-emerald-600 w-5 h-5"></i> Analisis Keputusan Keseluruhan (${type === 'pentaksiran_1' ? 'Pentaksiran 1' : 'UASA'})
                            </h4>
                        </div>
                        <div class="p-6 grid grid-cols-1 md:grid-cols-4 gap-6">
                            ${subjects.map(sub => {
                                let totalScores = 0;
                                let count = 0;
                                let passCount = 0;

                                filteredStudents.forEach(s => {
                                    const score = studentMarks[`${s.id}_${type}_${sub.code}`];
                                    if (score !== undefined) {
                                        totalScores += score;
                                        count++;
                                        if (score >= passGradeThreshold) passCount++;
                                    }
                                });

                                const pct = count > 0 ? Math.round((passCount / count) * 100) : 0;
                                const avg = count > 0 ? Math.round(totalScores / count) : 0;

                                return `
                                <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 space-y-2">
                                    <p class="font-bold text-slate-800 text-sm truncate">${sub.name}</p>
                                    <div class="flex justify-between text-xs text-slate-500 font-medium">
                                        <span>Kadar Lulus:</span>
                                        <span class="font-bold text-emerald-600">${pct}%</span>
                                    </div>
                                    <div class="w-full bg-slate-200 rounded-full h-1.5">
                                        <div class="bg-emerald-500 h-1.5 rounded-full" style="width: ${pct}%"></div>
                                    </div>
                                    <div class="flex justify-between text-[11px] text-slate-400 font-bold uppercase mt-1">
                                        <span>Purata Skor:</span>
                                        <span>${avg}%</span>
                                    </div>
                                </div>`;
                            }).join('')}
                        </div>
                    </div>

                    <!-- Detailed Spreadsheet Report Table -->
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                        <div class="p-6 border-b border-gray-100 bg-gray-50/50 flex justify-between items-center">
                            <h4 class="font-bold text-slate-800 text-lg flex items-center gap-2">
                                <i data-lucide="grid" class="text-slate-600 w-5 h-5"></i> Transkrip & Gred Semua Subjek (${currentSelectedClass})
                            </h4>
                            <span class="text-xs font-bold bg-slate-100 text-slate-800 px-3 py-1 rounded-full uppercase">
                                JBA2054
                            </span>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left min-w-[750px]">
                                <thead>
                                    <tr class="bg-slate-50 text-slate-700 text-xs uppercase font-bold border-b border-slate-100">
                                        <th class="p-4">Nama Murid</th>
                                        ${headerSubjectsHTML}
                                    </tr>
                                </thead>
                                <tbody>
                                    ${rows}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>`;
            }

            // 5. SETTINGS PAGE (TETAPAN)
            else if (currentPage === 'settings') {
                container.innerHTML = `
                <div class="max-w-3xl space-y-8">
                    <div class="bg-white p-8 rounded-2xl border border-emerald-100 shadow-sm space-y-6">
                        <h4 class="font-bold text-gray-800 text-xl flex items-center gap-2 border-b border-gray-100 pb-4">
                            <i data-lucide="sliders" class="text-emerald-600 w-6 h-6"></i> Tetapan Pentaksiran Akademik
                        </h4>
                        
                        <form onsubmit="updateSettings(event)" class="space-y-6">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div class="space-y-2">
                                    <label class="text-sm font-semibold text-gray-700 flex items-center gap-2">
                                        <i data-lucide="user" class="w-4 h-4 text-emerald-600"></i> Nama Penuh Guru
                                    </label>
                                    <input id="teacher-display-name" type="text" value="${currentUser.fullName}" class="w-full p-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none text-sm font-semibold text-gray-700" placeholder="KHAIRULAZMAN BIN DOLLAH">
                                </div>

                                <div class="space-y-2">
                                    <label class="text-sm font-semibold text-gray-700 flex items-center gap-2">
                                        <i data-lucide="mail" class="w-4 h-4 text-emerald-600"></i> Emel DELIMa
                                    </label>
                                    <input type="text" readonly disabled value="${currentUser.email}" class="w-full p-3 border border-gray-200 rounded-xl bg-gray-50 text-gray-400 outline-none text-sm font-semibold cursor-not-allowed">
                                </div>
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div class="space-y-2">
                                    <label class="text-sm font-semibold text-gray-700 flex items-center gap-2">
                                        <i data-lucide="award" class="w-4 h-4 text-emerald-600"></i> Markah Minimum Lulus (%)
                                    </label>
                                    <input id="threshold-pass-input" type="number" min="30" max="60" value="${passGradeThreshold}" class="w-full p-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none text-sm font-bold text-gray-700">
                                    <p class="text-[11px] text-gray-400 font-medium">Standard kebangsaan untuk Pentaksiran Rendah & UASA ialah 40%.</p>
                                </div>

                                <div class="space-y-2">
                                    <label class="text-sm font-semibold text-gray-700 flex items-center gap-2">
                                        <i data-lucide="shield" class="w-4 h-4 text-emerald-600"></i> Peranan Akses (Role)
                                    </label>
                                    <span class="inline-block px-4 py-3 border border-emerald-100 bg-emerald-50 text-emerald-800 rounded-xl text-sm font-bold uppercase tracking-wide w-full">
                                        ${currentUser.role}
                                    </span>
                                </div>
                            </div>

                            <div class="border-t border-gray-100 pt-6 flex justify-end">
                                <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-3 rounded-xl transition-all shadow-md flex items-center gap-2">
                                    <i data-lucide="save" class="w-4 h-4"></i> Simpan Segala Tetapan
                                </button>
                            </div>
                        </form>
                    </div>

                    <div class="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm space-y-4">
                        <h5 class="font-bold text-slate-800 text-base flex items-center gap-2">
                            <i data-lucide="server" class="text-slate-600 w-5 h-5"></i> Spesifikasi Sistem
                        </h5>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-center">
                            <div class="bg-slate-50 p-3 rounded-xl">
                                <p class="text-xs text-gray-400 font-bold uppercase">Versi</p>
                                <p class="text-sm font-black text-slate-700">v2.3.0</p>
                            </div>
                            <div class="bg-slate-50 p-3 rounded-xl">
                                <p class="text-xs text-gray-400 font-bold uppercase">Lokasi Server</p>
                                <p class="text-sm font-black text-slate-700">Johor, MY</p>
                            </div>
                            <div class="bg-slate-50 p-3 rounded-xl">
                                <p class="text-xs text-gray-400 font-bold uppercase">Teknologi</p>
                                <p class="text-sm font-black text-slate-700">HTML5 / Tailwind</p>
                            </div>
                            <div class="bg-slate-50 p-3 rounded-xl">
                                <p class="text-xs text-gray-400 font-bold uppercase">Sekolah</p>
                                <p class="text-sm font-black text-slate-700">JBA2054</p>
                            </div>
                        </div>
                    </div>
                </div>`;
            }
            
            lucide.createIcons();
        }

        // Initialize Icons for Login Page on load
        lucide.createIcons();
    </script>
</body>
</html>
