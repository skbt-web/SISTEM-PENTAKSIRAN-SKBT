        // --- NOTIFICATION SYSTEM ---
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const bgClasses = {
                success: 'bg-emerald-600 border-emerald-500 text-white',
                danger: 'bg-rose-600 border-rose-500 text-white',
                info: 'bg-slate-800 border-slate-700 text-white',
                warning: 'bg-amber-500 border-amber-400 text-slate-900'
            };

            const iconMap = {
                success: 'check-circle-2',
                danger: 'alert-triangle',
                info: 'info',
                warning: 'alert-circle'
            };

            toast.className = `flex items-center gap-3 px-5 py-3 rounded-2xl shadow-lg border text-sm font-semibold transition-all duration-300 transform translate-y-2 opacity-0 pointer-events-auto ${bgClasses[type]}`;
            toast.innerHTML = `
                <i data-lucide="${iconMap[type]}" class="w-5 h-5 shrink-0"></i>
                <span>${message}</span>
            `;

            container.appendChild(toast);
            lucide.createIcons();

            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 50);

            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => { toast.remove(); }, 300);
            }, 3500);
        }

        // --- GRED PEMARKAHAN UASA BAHARU ---
        function calculateUASAGrade(score) {
            if (score === null || score === undefined || score === '') {
                return { grade: '-', color: 'text-gray-400 bg-gray-50 border-gray-100', label: 'Belum Dinilai' };
            }
            const num = parseFloat(score);
            if (num >= 82 && num <= 100) {
                return { grade: 'A', color: 'text-emerald-700 bg-emerald-50 border-emerald-200', label: 'CEMERLANG' };
            }
            if (num >= 66 && num <= 81) {
                return { grade: 'B', color: 'text-cyan-700 bg-cyan-50 border-cyan-200', label: 'KEPUJIAN' };
            }
            if (num >= 50 && num <= 65) {
                return { grade: 'C', color: 'text-amber-700 bg-amber-50 border-amber-200', label: 'MEMUASKAN' };
            }
            if (num >= 35 && num <= 49) {
                return { grade: 'D', color: 'text-orange-700 bg-orange-50 border-orange-200', label: 'MENCAPAI TAHAP MINIMUM' };
            }
            if (num >= 1 && num <= 34) {
                return { grade: 'E', color: 'text-rose-700 bg-rose-50 border-rose-200', label: 'BELUM MENCAPAI TAHAP MINIMUM' };
            }
            if (num === 0) {
                return { grade: 'F', color: 'text-red-700 bg-red-100 border-red-300', label: 'TIDAK MENGUASAI' };
            }
            return { grade: '-', color: 'text-gray-400 bg-gray-50 border-gray-100', label: 'Belum Dinilai' };
        }

                        } else {
                            delete studentPBD[key];

                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-emerald-50 hover:shadow-md transition-all">
                            <p class="text-gray-400 text-xs font-bold uppercase tracking-wider mb-2">Kadar Kelulusan Am</p>
                            <h3 class="text-3xl font-bold text-slate-800">${passPercentage}%</h3>
                            <p class="text-xs text-emerald-600 mt-2 font-bold">${passingStudentsCount} dari ${classStudents.length} murid melepasi tahap minimum</p>
                        </div>
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-emerald-50 hover:shadow-md transition-all">
                            <p class="text-gray-400 text-xs font-bold uppercase tracking-wider mb-2">Pelajar Terbaik Kelas</p>
                            <h3 class="text-lg font-black text-slate-800 truncate" title="${topStudent}">${topStudent}</h3>
                            <p class="text-xs text-teal-600 font-bold mt-2 flex items-center gap-1">
                                <i data-lucide="crown" class="w-3.5 h-3.5"></i> Pencapaian tertinggi
                            </p>
                        </div>
                    </div>

                    <div class="bg-white rounded-2xl shadow-sm border border-emerald-50 overflow-hidden">
                        <div class="p-6 border-b border-emerald-50 bg-emerald-50/10 flex justify-between items-center">
                            <h4 class="font-bold text-slate-800 text-lg flex items-center gap-2">
                                <i data-lucide="award" class="text-emerald-600 w-5 h-5"></i> Kedudukan Prestasi Murid Kelas (${targetClass})
                            </h4>
                            <button onclick="window.print()" class="bg-slate-800 hover:bg-slate-900 text-white px-4 py-2 rounded-xl font-bold text-xs flex items-center gap-1.5 transition-all shadow-sm">
                                <i data-lucide="printer" class="w-3.5 h-3.5"></i> Cetak Analisis Kelas
                            </button>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left min-w-[800px]">
                                <thead>
                                    <tr class="bg-slate-50 text-slate-700 text-xs uppercase font-bold border-b border-slate-100">
                                        <th class="p-4 text-center w-12">No.</th>
                                        <th class="p-4">Nama Penuh Murid</th>
                                        ${subjects.slice(0, 4).map(s => `<th class="p-4 text-center">${s}</th>`).join('')}
                                        <th class="p-4 text-center bg-emerald-50/20">Purata (%)</th>
                                        <th class="p-4 text-center">Gred Am</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${studentsRows}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>`;
            }

            // 4. DATA MURID (ADMIN ONLY)
            else if (currentPage === 'data_murid') {
                let rows = students.map(s => `
                    <tr class="hover:bg-slate-50 border-b border-gray-100 transition-colors">
                        <td class="p-4 text-sm font-bold text-slate-800">#${s.id}</td>
                        <td class="p-4 text-sm font-semibold text-gray-700 uppercase">${s.nama}</td>
                        <td class="p-4 text-sm font-semibold text-slate-500 font-mono">${s.ic}</td>
                        <td class="p-4 text-sm font-semibold text-slate-500">${s.kelas}</td>
                    </tr>
                `).join('');

                container.innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <!-- Penjelasan Kemasukan -->
                    <div class="bg-white p-6 rounded-2xl border border-emerald-100 shadow-sm space-y-4 self-start">
                        <h4 class="font-bold text-gray-800 text-lg flex items-center gap-2">
                            <i data-lucide="info" class="text-emerald-600 w-5 h-5"></i> Maklumat Pendaftaran
                        </h4>
                        <p class="text-xs text-gray-500 leading-relaxed">
                            Secara amnya, senarai pendaftaran ditarik secara langsung dari Sistem Maklumat Murid (SMM) selaras dengan rekod Google Spreadsheet yang telah dimuat naik.
                        </p>
                        <div class="p-3 bg-emerald-50 rounded-xl">
                            <p class="text-[10px] text-emerald-800 font-bold uppercase">Nota Penting</p>
                            <p class="text-[11px] text-emerald-700 mt-1">Urusan penukaran nama murid atau pembetulan Kad Pengenalan mestilah dirujuk kepada Guru ICT Sekolah.</p>
                        </div>
                    </div>

                    <!-- Students List Table -->
                    <div class="lg:col-span-2 bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden">
                        <div class="p-6 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
                            <h4 class="font-bold text-slate-800 text-lg flex items-center gap-2">
                                <i data-lucide="users" class="text-slate-600 w-5 h-5"></i> Senarai Murid Berdaftar SMM
                            </h4>
                            <span class="text-xs font-bold bg-slate-100 text-slate-800 px-3 py-1 rounded-full uppercase">
                                Jumlah: ${students.length} Murid
                            </span>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left min-w-[500px]">
                                <thead>
                                    <tr class="bg-gray-50 text-slate-500 text-xs uppercase font-bold border-b border-gray-100">
                                        <th class="p-4 w-16">ID</th>
                                        <th class="p-4">Nama Penuh</th>
                                        <th class="p-4">No. Kad Pengenalan</th>
                                        <th class="p-4">Kelas</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${rows}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>`;
            }

            // 5. LAPORAN UASA (ADMIN VIEW)
            else if (currentPage === 'laporan_uasa') {
                const filteredStudents = students.filter(s => s.kelas === selectedClass);
                let headerSubjectsHTML = subjects.slice(0, 5).map(sub => `<th class="p-4 text-center text-xs">${sub}</th>`).join('');

                let rows = filteredStudents.map(s => {
                    let subjectCells = subjects.slice(0, 5).map(sub => {
                        const score = studentMarks[`${s.id}_${selectedYear}_${selectedAssessment}_${sub}`];
                        if (score === undefined) {
                            return `<td class="p-4 text-center text-gray-400 font-medium italic">-</td>`;
                        }
                        const gradeInfo = calculateUASAGrade(score);
                        return `
                        <td class="p-4 text-center">
                            <span class="block text-sm font-bold text-gray-800">${score}%</span>
                            <span class="text-[10px] font-black px-1.5 py-0.5 rounded border ${gradeInfo.color}">${gradeInfo.grade}</span>
                        </td>`;
                    }).join('');

                    return `
                    <tr class="hover:bg-slate-50 border-b border-gray-100 transition-colors">
                        <td class="p-4 text-sm font-bold text-gray-800 uppercase">${s.nama}</td>
                        ${subjectCells}
                    </tr>`;
                }).join('');

                if (rows.length === 0) {
                    rows = `<tr><td colspan="${subjects.length + 1}" class="p-8 text-center text-gray-400 font-medium">Tiada rekod murid bagi kelas terpilih.</td></tr>`;
                }

                container.innerHTML = `
                <div class="space-y-6">
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-emerald-50 flex flex-wrap gap-4 items-center justify-between">
                        <div class="flex items-center gap-3">
                            <label class="text-xs font-bold text-gray-400 uppercase tracking-wider">Pilih Kelas Laporan:</label>
                            <select id="sel-class" onchange="selectedClass = this.value; renderPage()" class="bg-emerald-600 text-white rounded-xl px-4 py-2 text-sm font-bold outline-none cursor-pointer">
                                ${classes.map(cls => `<option value="${cls}" ${selectedClass === cls ? 'selected' : ''}>${cls}</option>`).join('')}
                            </select>
                        </div>
                        <button onclick="window.print()" class="bg-slate-800 hover:bg-slate-900 text-white px-5 py-2 rounded-xl font-bold text-sm flex items-center gap-2 transition-all shadow-md">
                            <i data-lucide="printer" class="w-4 h-4"></i> Cetak Laporan Kelas
                        </button>
                    </div>

                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                        <div class="p-6 border-b border-gray-100 bg-gray-50/50 flex justify-between items-center">
                            <h4 class="font-bold text-slate-800 text-lg flex items-center gap-2">
                                <i data-lucide="grid" class="text-slate-600 w-5 h-5"></i> Transkrip Keputusan Utama (${selectedClass})
                            </h4>
                            <span class="text-xs font-bold bg-slate-100 text-slate-800 px-3 py-1 rounded-full uppercase">SKBT</span>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left min-w-[750px]">
                                <thead>
                                    <tr class="bg-slate-50 text-slate-700 text-xs uppercase font-bold border-b border-slate-100">
                                        <th class="p-4">Nama Murid</th>
                                        ${headerSubjectsHTML}
                                    </tr>
                                </thead>
                                <tbody>
                                    ${rows}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>`;
            }

            // 6. TETAPAN (SETTINGS)
            else if (currentPage === 'settings') {
                container.innerHTML = `
                <div class="max-w-3xl space-y-8">
                    <div class="bg-white p-8 rounded-2xl border border-emerald-100 shadow-sm space-y-6">
                        <h4 class="font-bold text-gray-800 text-xl flex items-center gap-2 border-b border-gray-100 pb-4">
                            <i data-lucide="sliders" class="text-emerald-600 w-6 h-6"></i> Tetapan Profil
                        </h4>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="space-y-2">
                                <label class="text-sm font-semibold text-gray-700 flex items-center gap-2">Nama Pengguna</label>
                                <input type="text" readonly disabled value="${currentUser.fullName}" class="w-full p-3 border border-gray-200 rounded-xl bg-gray-50 text-gray-400 outline-none text-sm font-semibold cursor-not-allowed">
                            </div>
                            <div class="space-y-2">
                                <label class="text-sm font-semibold text-gray-700 flex items-center gap-2">Sistem Emel</label>
                                <input type="text" readonly disabled value="${currentUser.email}" class="w-full p-3 border border-gray-200 rounded-xl bg-gray-50 text-gray-400 outline-none text-sm font-semibold cursor-not-allowed">
                            </div>
                        </div>
                    </div>
                </div>`;
            }
            
            lucide.createIcons();
        }

        // --- REALTIME SCORE & GRADE CALCULATIONS (UTAMAKAN VISUAL) ---
        function updateRowGrade(inputElement, studentId) {
            const rawScore = inputElement.value.trim();
            const rowElement = inputElement.closest('tr');
            const gradeSpan = rowElement.querySelector('.row-grade');
            const totalCell = rowElement.querySelector('.row-total');
            
            const gradeInfo = calculateUASAGrade(rawScore);

            if (gradeSpan) {
                gradeSpan.className = `row-grade px-3 py-1.5 rounded-full text-xs font-extrabold border ${gradeInfo.color}`;
                gradeSpan.innerText = `${gradeInfo.grade} (${gradeInfo.label})`;
            }

            if (totalCell) {
                totalCell.innerText = rawScore !== '' ? `${rawScore}/100` : '-';
            }
        }

        // Set up Lucide Icons on launch
        lucide.createIcons();
    </script>
</body>
</html>
