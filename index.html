        function handleLogin(type) {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('login-error');

            errorDiv.classList.add('hidden');

            if (!email || !password) {
                showError('Sila masukkan emel dan kata laluan.');
                return;
            }

                return;
            }

            const list = type === 'admin' ? SenaraiPengguna.admin : SenaraiPengguna.guru;
            const found = list.find(u => u.email === email && u.password === password);

            if (found) {
                currentUser = { 
                    ...found, 
                    role: type === 'admin' ? 'Admin' : (type === 'guru_kelas' ? 'Guru Kelas' : 'Guru') 
                };
                isAdmin = type === 'admin';
                showApp();
                showToast(`Log masuk berjaya sebagai ${currentUser.role}: ${currentUser.name}!`, 'success');

                showError(`Kredensial ${type === 'admin' ? 'Admin' : (type === 'guru_kelas' ? 'Guru Kelas' : 'Guru')} tidak sah.`);

        }

            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
            showToast('Anda telah log keluar sistem.', 'info');
        }

            document.getElementById('user-role-display').innerText = currentUser.role;

        function navigate(pageId) {
            currentPage = pageId;
            document.getElementById('page-title').innerText = pageId.replace(/_/g, ' ');
            
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            sidebar.classList.add('closed');
            overlay.classList.add('hidden');

            document.querySelectorAll('.nav-btn').forEach(btn => {
                if (btn.getAttribute('data-page') === pageId) {
                    btn.classList.add('bg-emerald-50', 'text-emerald-700', 'font-bold');
                    btn.classList.remove('text-gray-500');
                } else {
                    btn.classList.remove('bg-emerald-50', 'text-emerald-700', 'font-bold');
                    btn.classList.add('text-gray-500');
                }
            });

            renderPage();
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            if (sidebar.classList.contains('closed')) {
                sidebar.classList.remove('closed');
                overlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('closed');
                overlay.classList.add('hidden');
            }
        }

                success: 'check-circle-2',
                danger: 'alert-triangle',
                info: 'info',
                warning: 'alert-circle'
            };

            toast.className = `flex items-center gap-3 px-5 py-3 rounded-2xl shadow-lg border text-sm font-semibold transition-all duration-300 transform translate-y-2 opacity-0 pointer-events-auto ${bgClasses[type]}`;
            toast.innerHTML = `

                setTimeout(() => { toast.remove(); }, 300);
            }, 3500);

        // --- GRED PEMARKAHAN UASA BAHARU ---
        function calculateUASAGrade(score) {
            if (score === null || score === undefined || score === '') {
                return { grade: '-', color: 'text-gray-400 bg-gray-50 border-gray-100', label: 'Belum Dinilai' };
            }
            const num = parseFloat(score);
            if (num >= 82 && num <= 100) {
                return { grade: 'A', color: 'text-emerald-700 bg-emerald-50 border-emerald-200', label: 'CEMERLANG' };
            }
            if (num >= 66 && num <= 81) {
                return { grade: 'B', color: 'text-cyan-700 bg-cyan-50 border-cyan-200', label: 'KEPUJIAN' };
            }
            if (num >= 50 && num <= 65) {
                return { grade: 'C', color: 'text-amber-700 bg-amber-50 border-amber-200', label: 'MEMUASKAN' };
            }
            if (num >= 35 && num <= 49) {
                return { grade: 'D', color: 'text-orange-700 bg-orange-50 border-orange-200', label: 'MENCAPAI TAHAP MINIMUM' };
            }
            if (num >= 1 && num <= 34) {
                return { grade: 'E', color: 'text-rose-700 bg-rose-50 border-rose-200', label: 'BELUM MENCAPAI TAHAP MINIMUM' };
            }
            if (num === 0) {
                return { grade: 'F', color: 'text-red-700 bg-red-100 border-red-300', label: 'TIDAK MENGUASAI' };
            }
            return { grade: '-', color: 'text-gray-400 bg-gray-50 border-gray-100', label: 'Belum Dinilai' };
        }

        // --- SAVING & ACTIONS ---
        function saveMarks() {
            const rows = document.querySelectorAll('.student-row');
            let successCount = 0;

            rows.forEach(row => {
                const sId = row.getAttribute('data-id');
                const markInput = row.querySelector('.mark-input');
                const pbdSelect = row.querySelector('.pbd-select');

                if (markInput) {
                    const markVal = markInput.value.trim();
                    const key = `${sId}_${selectedYear}_${selectedAssessment}_${selectedSubject}`;
                    
                    if (markVal === '') {
                        delete studentMarks[key];
                    } else {
                        const num = parseFloat(markVal);
                        if (!isNaN(num) && num >= 0 && num <= 100) {
                            studentMarks[key] = num;
                            successCount++;
                        }
                    }

                    if (pbdSelect) {
                        const pbdVal = pbdSelect.value;
                        if (pbdVal) {
                            studentPBD[key] = pbdVal;
                        } else {
                            delete studentPBD[key];
                        }
                    }
                }
            });

            showToast(`Berjaya menyimpan ${successCount} rekod markah secara tempatan.`, 'success');
            renderPage();
        }

        function handleCSVImport(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                const lines = text.split(/\r?\n/);
                let successCount = 0;
                let skipCount = 0;

                lines.forEach((line, index) => {
                    if (!line.trim()) return;

                    const cols = line.split(',');
                    if (index === 0 && (line.toLowerCase().includes('nama') || line.toLowerCase().includes('ic') || line.toLowerCase().includes('kelas'))) {
                        return;
                    }

                    if (cols.length >= 3) {
                        const nama = cols[0].trim().toUpperCase();
                        const ic = cols[1].trim();
                        const kelas = cols[2].trim().toUpperCase();

                        if (nama && ic && kelas) {
                            if (classes.includes(kelas)) {
                                const exists = students.some(s => s.ic === ic);
                                if (!exists) {
                                    const newId = students.length > 0 ? Math.max(...students.map(s => s.id)) + 1 : 1;
                                    students.push({ id: newId, nama, ic, kelas });
                                    successCount++;
                                } else {
                                    skipCount++;
                                }
                            } else {
                                skipCount++;
                            }
                        } else {
                            skipCount++;
                        }
                    } else {
                        skipCount++;
                    }
                });

                if (successCount > 0) {
                    showToast(`Berjaya mengimport ${successCount} murid dari fail CSV!`, 'success');
                }
                if (skipCount > 0) {
                    showToast(`${skipCount} rekod diabaikan (format salah / kelas tidak sepadan / kad pengenalan pendua).`, 'warning');
                }

                event.target.value = '';
                renderPage();
            };
            reader.readAsText(file);
        }

        // --- DELETE STUDENT FUNCTION ---
        function deleteStudent(id) {
            const idx = students.findIndex(s => s.id === id);
            if (idx !== -1) {
                const studentName = students[idx].nama;
                students.splice(idx, 1);
                
                for (const key in studentMarks) {
                    if (key.startsWith(`${id}_`)) delete studentMarks[key];
                }
                for (const key in studentPBD) {
                    if (key.startsWith(`${id}_`)) delete studentPBD[key];
                }
                
                showToast(`Murid [${studentName}] telah berjaya dipadamkan daripada pangkalan data SMM.`, 'info');
                renderPage();
            }
        }

        // --- GET ACTIVE SUBJECTS DYNAMICALLY ---
        function getActiveSubjects(classYear) {
            if (classYear >= 4) {
                const active = [...baseSubjects];
                const arabIndex = active.indexOf('BAHASA ARAB');
                if (arabIndex !== -1) {
                    active.splice(arabIndex + 1, 0, 'SEJARAH');
                } else {
                    active.push('SEJARAH');
                }
                active.push('REKA BENTUK TEKNOLOGI');
                return active;
            } else {
                return baseSubjects;
            }
        }

        // --- CALCULATE CLASS RANKINGS IN-MEMORY ---
        function getClassRankings(targetClass, targetAssessment) {
            const classStudents = students.filter(s => s.kelas === targetClass);
            const classYear = parseInt(targetClass.charAt(0)) || 1;
            const activeSubjects = getActiveSubjects(classYear);

            const performances = classStudents.map(s => {
                let totalMarks = 0;
                let count = 0;
                activeSubjects.forEach(sub => {
                    const key = `${s.id}_${selectedYear}_${targetAssessment}_${sub}`;
                    const score = studentMarks[key];
                    if (score !== undefined) {
                        totalMarks += score;
                        count++;
                    }
                });
                const percentage = count > 0 ? Math.round((totalMarks / (count * 100)) * 100) : 0;
                return {
                    id: s.id,
                    totalMarks: totalMarks,
                    percentage: percentage
                };
            });

            performances.sort((a, b) => b.percentage - a.percentage || b.totalMarks - a.totalMarks);

            const rankings = {};
            performances.forEach((p, index) => {
                rankings[p.id] = index + 1;
            });
            return rankings;
        }

                                <tr class="bg-slate-50 text-slate-700 text-[11px] uppercase font-extrabold border-b border-slate-100">
                                    <th rowspan="2" class="p-4 w-[250px] border-r border-slate-100 sticky left-0 bg-slate-50/90 z-20 shadow-[2px_0_5px_rgba(0,0,0,0.02)] sticky-col">Nama Murid</th>
                                    <th rowspan="2" class="p-4 w-[140px] border-r border-slate-100">No. Kad Pengenalan</th>
                                    ${headerSubjectsHTML}
                                    <th rowspan="2" class="p-4 w-[140px] border-r border-slate-100 text-center">Markah Keseluruhan</th>
                                    <th rowspan="2" class="p-4 w-[110px] border-r border-slate-100 text-center">Peratus</th>
                                    <th rowspan="2" class="p-4 w-[110px] border-r border-slate-100 text-center">Kedudukan</th>
                                    <th rowspan="2" class="p-4 w-[140px] text-center">Gred Pencapaian</th>
                                </tr>
                                <tr class="bg-slate-50/50 text-[9px] border-b border-slate-100 text-slate-700">
                                    ${subHeadersHTML}
                                </tr>
                            </thead>
                            <tbody>
                                ${monitoringRowsHTML}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>`;
        }

        // --- EXCLUSIVE ADMIN ANALYSIS MODULES RENDERING ---
        function renderAdminAnalysisModule() {
            let innerHTML = '';

            const currentClassStudents = students.filter(s => s.kelas === analysisSelectedClass);
            const activeSubjects = getActiveSubjects(parseInt(analysisSelectedClass.charAt(0)) || 1);

            // Analysis Filter Bar
            let filterBarHTML = `
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 space-y-4">
                <div class="border-b border-slate-100 pb-3 flex items-center gap-2 text-emerald-600">
                    <i data-lucide="bar-chart-2" class="w-5 h-5"></i>
                    <h3 class="font-bold text-slate-800 text-sm uppercase tracking-wider">Parameter Analisis Prestasi</h3>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <!-- 1. Dropdown Jenis Ujian -->
                    <div class="space-y-1.5">
                        <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Pilih Jenis Ujian</label>
                        <select id="analysis-sel-assessment" onchange="analysisSelectedAssessment = this.value; renderPage();" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold outline-none focus:ring-2 focus:ring-emerald-500 cursor-pointer">
                            ${assessments.map(t => `<option value="${t}" ${analysisSelectedAssessment === t ? 'selected' : ''}>${t}</option>`).join('')}
                        </select>
                    </div>

                    <!-- 2. Dropdown Mod Analisis -->
                    <div class="space-y-1.5">
                        <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Pilih Mod Analisis</label>
                        <select id="analysis-sel-mode" onchange="analysisSelectedMode = this.value; renderPage();" class="w-full p-2.5 bg-emerald-600 text-white rounded-xl text-xs font-bold outline-none focus:ring-2 focus:ring-emerald-300 cursor-pointer">
                            <option value="individu" ${analysisSelectedMode === 'individu' ? 'selected' : ''}>Analisis Individu</option>
                            <option value="kelas" ${analysisSelectedMode === 'kelas' ? 'selected' : ''}>Analisis Kelas</option>
                            <option value="gabungan_kelas" ${analysisSelectedMode === 'gabungan_kelas' ? 'selected' : ''}>Analisis Gabungan Kelas</option>
                        </select>
                    </div>

                    <!-- 3. Dynamic Filter (Class or Student based on mode) -->
                    ${analysisSelectedMode === 'individu' ? `
                    <div class="space-y-1.5">
                        <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Pilih Murid</label>
                        <select id="analysis-sel-student" onchange="analysisSelectedStudentId = parseInt(this.value); renderPage();" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold outline-none focus:ring-2 focus:ring-emerald-500 cursor-pointer">
                            ${students.map(st => `<option value="${st.id}" ${analysisSelectedStudentId === st.id ? 'selected' : ''}>[${st.kelas}] ${st.nama}</option>`).join('')}
                        </select>
                    </div>
                    ` : (analysisSelectedMode === 'kelas' ? `
                    <div class="space-y-1.5">
                        <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Pilih Kelas</label>
                        <select id="analysis-sel-class" onchange="analysisSelectedClass = this.value; renderPage();" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold outline-none focus:ring-2 focus:ring-emerald-500 cursor-pointer">
                            ${classes.map(cls => `<option value="${cls}" ${analysisSelectedClass === cls ? 'selected' : ''}>${cls}</option>`).join('')}
                        </select>
                    </div>
                    ` : `
                    <div class="space-y-1.5 opacity-40">
                        <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Status Mod</label>
                        <input type="text" disabled readonly value="Gabungan Semua Kelas Aktif" class="w-full p-2.5 bg-slate-100 border border-slate-200 rounded-xl text-xs font-bold text-slate-500 outline-none">
                    </div>
                    `)}
                </div>
            </div>`;

            // A. MOD ANALISIS INDIVIDU
            if (analysisSelectedMode === 'individu') {
                const targetStudent = students.find(s => s.id === analysisSelectedStudentId) || students[0];
                if (!targetStudent) return filterBarHTML;

                const studentClassRankings = getClassRankings(targetStudent.kelas, analysisSelectedAssessment);
                const rank = studentClassRankings[targetStudent.id] || '-';

                // Query and calculate all scores for this student
                let totalScore = 0;
                let subjectsEvaluatedCount = 0;
                let activeSubjectsList = getActiveSubjects(parseInt(targetStudent.kelas.charAt(0)) || 1);

                let breakdownRows = activeSubjectsList.map(sub => {
                    const key = `${targetStudent.id}_${selectedYear}_${analysisSelectedAssessment}_${sub}`;
                    const score = studentMarks[key];
                    const pbd = studentPBD[key] !== undefined ? studentPBD[key] : '-';
                    const gradeInfo = calculateUASAGrade(score);

                    if (score !== undefined) {
                        totalScore += score;
                        subjectsEvaluatedCount++;
                    }

                    return `
                    <div class="flex items-center justify-between p-3 bg-slate-50 rounded-2xl border border-slate-100">
                        <div class="space-y-0.5">
                            <p class="text-xs font-bold text-slate-700">${sub}</p>
                            <span class="text-[9px] text-indigo-600 font-extrabold bg-indigo-50 px-2 py-0.5 rounded-full uppercase">PBD Semasa: ${pbd}</span>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="font-mono text-xs font-black text-slate-800">${score !== undefined ? score + '%' : '-'}</span>
                            <span class="px-2 py-0.5 text-[10px] font-black rounded border ${gradeInfo.color}">${gradeInfo.grade}</span>
                        </div>
                    </div>`;
                }).join('');

                const finalAvg = subjectsEvaluatedCount > 0 ? Math.round(totalScore / subjectsEvaluatedCount) : 0;
                const finalGrade = calculateUASAGrade(finalAvg);

                innerHTML = `
                ${filterBarHTML}
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <!-- Student Summary Card -->
                    <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm space-y-6 self-start">
                        <div class="text-center space-y-2">
                            <div class="w-16 h-16 bg-emerald-500 text-white rounded-full flex items-center justify-center font-black text-2xl mx-auto shadow-md">
                                ${targetStudent.nama.charAt(0)}
                            </div>
                            <h4 class="font-extrabold text-slate-800 text-sm uppercase leading-tight">${targetStudent.nama}</h4>
                            <p class="text-[10px] font-mono font-bold text-slate-400">IC: ${targetStudent.ic}</p>
                            <span class="inline-block bg-slate-100 text-slate-700 text-[10px] font-bold px-3 py-1 rounded-full">Kelas: ${targetStudent.kelas}</span>
                        </div>

                        <div class="border-t border-slate-100 pt-4 space-y-3">
                            <div class="flex justify-between items-center text-xs font-bold text-slate-500">
                                <span>Purata Peratus</span>
                                <span class="text-emerald-600 font-black">${finalAvg}%</span>
                            </div>
                            <div class="flex justify-between items-center text-xs font-bold text-slate-500">
                                <span>Gred Am Pencapaian</span>
                                <span class="px-2 py-0.5 font-black text-[10px] rounded border ${finalGrade.color}">${finalGrade.grade}</span>
                            </div>
                            <div class="flex justify-between items-center text-xs font-bold text-slate-500">
                                <span>Kedudukan dalam Kelas</span>
                                <span class="text-indigo-600 font-black">No. ${rank} / ${students.filter(s => s.kelas === targetStudent.kelas).length}</span>
                            </div>
                        </div>
                    </div>

                    <!-- Breakdown Subject List -->
                    <div class="lg:col-span-2 bg-white p-6 rounded-3xl border border-slate-100 shadow-sm space-y-4">
                        <h4 class="font-bold text-slate-800 text-sm uppercase tracking-wider border-b border-slate-100 pb-2">Helaian Gred Pentaksiran Subjek</h4>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            ${breakdownRows}
                        </div>
                    </div>
                </div>`;
            }

            // B. MOD ANALISIS KELAS
            else if (analysisSelectedMode === 'kelas') {
                const classStudents = students.filter(s => s.kelas === analysisSelectedClass);
                let classRankings = getClassRankings(analysisSelectedClass, analysisSelectedAssessment);

                let sumScores = 0;
                let scoreCount = 0;
                let passCount = 0;
                let failCount = 0;
                let cemerlangCount = 0;

                classStudents.forEach(st => {
                    let stSum = 0;
                    let stCount = 0;
                    activeSubjects.forEach(sub => {
                        const key = `${st.id}_${selectedYear}_${analysisSelectedAssessment}_${sub}`;
                        const score = studentMarks[key];
                        if (score !== undefined) {
                            stSum += score;
                            stCount++;
                        }
                    });
                    if (stCount > 0) {
                        const avg = Math.round(stSum / stCount);
                        sumScores += avg;
                        scoreCount++;
                        if (avg >= 40) passCount++; else failCount++;
                        if (avg >= 82) cemerlangCount++;
                    }
                });

                const classAvgPercentage = scoreCount > 0 ? Math.round(sumScores / scoreCount) : 0;
                const passPercentage = scoreCount > 0 ? Math.round((passCount / scoreCount) * 100) : 0;

                let performanceListHTML = classStudents.map((s, index) => {
                    let stSum = 0;
                    let stCount = 0;
                    activeSubjects.forEach(sub => {
                        const key = `${s.id}_${selectedYear}_${analysisSelectedAssessment}_${sub}`;
                        const score = studentMarks[key];
                        if (score !== undefined) {
                            stSum += score;
                            stCount++;
                        }
                    });
                    const avg = stCount > 0 ? Math.round(stSum / stCount) : 0;
                    const gradeInfo = calculateUASAGrade(avg);
                    const rank = classRankings[s.id] || '-';

                    return `
                    <tr class="hover:bg-slate-50/50 border-b border-slate-100 transition-colors">
                        <td class="p-4 text-xs font-bold text-slate-700">${rank}</td>
                        <td class="p-4 text-xs font-bold text-slate-800 uppercase">${s.nama}</td>
                        <td class="p-4 text-xs font-mono font-bold text-slate-400">${s.ic}</td>
                        <td class="p-4 text-center font-mono text-xs font-black text-slate-800">${stSum}</td>
                        <td class="p-4 text-center font-mono text-xs font-black text-emerald-600 bg-emerald-50/20">${avg}%</td>
                        <td class="p-4 text-center">
                            <span class="px-2 py-0.5 text-[9px] font-black rounded border ${gradeInfo.color}">${gradeInfo.grade}</span>
                        </td>
                    </tr>`;
                }).join('');

                if (performanceListHTML.length === 0) {
                    performanceListHTML = `<tr><td colspan="6" class="p-8 text-center text-gray-400 font-bold italic">Tiada murid berdaftar dalam kelas ini.</td></tr>`;
                }

                innerHTML = `
                ${filterBarHTML}
                
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Purata Peratus Kelas</p>
                        <h3 class="text-2xl font-black text-slate-800">${classAvgPercentage}%</h3>
                    </div>
                    <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Kadar Kelulusan (%)</p>
                        <h3 class="text-2xl font-black text-emerald-600">${passPercentage}%</h3>
                    </div>
                    <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Murid Cemerlang (Gred A)</p>
                        <h3 class="text-2xl font-black text-indigo-600">${cemerlangCount} Orang</h3>
                    </div>
                    <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Gagal Minimum (<40%)</p>
                        <h3 class="text-2xl font-black text-rose-600">${failCount} Orang</h3>
                    </div>
                </div>

                <div class="bg-white rounded-3xl border border-slate-100 shadow-sm overflow-hidden">
                    <div class="p-5 border-b border-slate-100 bg-slate-50/50 flex justify-between items-center">
                        <h4 class="font-bold text-slate-800 text-sm uppercase tracking-wider">Senarai Pencapaian Murid Kelas [${analysisSelectedClass}]</h4>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left min-w-[700px]">
                            <thead>
                                <tr class="bg-slate-50 text-slate-600 text-[10px] uppercase font-bold border-b border-slate-100">
                                    <th class="p-4 w-16">No. KP</th>
                                    <th class="p-4">Nama Penuh Murid</th>
                                    <th class="p-4">No. Kad Pengenalan</th>
                                    <th class="p-4 text-center">Jumlah Markah</th>
                                    <th class="p-4 text-center">Peratus Am</th>
                                    <th class="p-4 text-center">Gred Am</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${performanceListHTML}
                            </tbody>
                        </table>
                    </div>
                </div>`;
            }

            // C. MOD ANALISIS GABUNGAN KELAS
            else {
                let gabunganHTML = classes.map((cls, index) => {
                    const clsStudents = students.filter(s => s.kelas === cls);
                    const clsYear = parseInt(cls.charAt(0)) || 1;
                    const clsActiveSubjects = getActiveSubjects(clsYear);

                    let sumScores = 0;
                    let scoreCount = 0;
                    let passed = 0;

                    clsStudents.forEach(st => {
                        let stSum = 0;
                        let stCount = 0;
                        clsActiveSubjects.forEach(sub => {
                            const key = `${st.id}_${selectedYear}_${analysisSelectedAssessment}_${sub}`;
                            const score = studentMarks[key];
                            if (score !== undefined) {
                                stSum += score;
                                stCount++;
                            }
                        });
                        if (stCount > 0) {
                            const avg = Math.round(stSum / stCount);
                            sumScores += avg;
                            scoreCount++;
                            if (avg >= 40) passed++;
                        }
                    });

                    const avgPercent = scoreCount > 0 ? Math.round(sumScores / scoreCount) : 0;
                    const passPercent = scoreCount > 0 ? Math.round((passed / scoreCount) * 100) : 0;
                    const gradeInfo = calculateUASAGrade(avgPercent);

                    return `
                    <tr class="hover:bg-slate-50/50 border-b border-slate-100 transition-colors">
                        <td class="p-4 text-xs font-bold text-slate-700">${index + 1}</td>
                        <td class="p-4 text-xs font-bold text-slate-800 uppercase">${cls}</td>
                        <td class="p-4 text-xs font-bold text-slate-600">${clsStudents.length} Orang</td>
                        <td class="p-4 text-center font-mono text-xs font-black text-slate-800">${avgPercent}%</td>
                        <td class="p-4 text-center">
                            <span class="px-2 py-0.5 text-[9px] font-black rounded border ${gradeInfo.color}">${gradeInfo.grade}</span>
                        </td>
                        <td class="p-4 text-center font-mono text-xs font-black text-emerald-600 bg-emerald-50/20">${passPercent}%</td>
                    </tr>`;
                }).join('');

                innerHTML = `
                ${filterBarHTML}
                <div class="bg-white rounded-3xl border border-slate-100 shadow-sm overflow-hidden">
                    <div class="p-5 border-b border-slate-100 bg-slate-50/50 flex justify-between items-center">
                        <h4 class="font-bold text-slate-800 text-sm uppercase tracking-wider">Matriks Gabungan Kelulusan Sekolah</h4>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left min-w-[700px]">
                            <thead>
                                <tr class="bg-slate-50 text-slate-600 text-[10px] uppercase font-bold border-b border-slate-100">
                                    <th class="p-4 w-16">No.</th>
                                    <th class="p-4">Kelas</th>
                                    <th class="p-4">Bil. Murid</th>
                                    <th class="p-4 text-center">Purata Kelas (%)</th>
                                    <th class="p-4 text-center">Gred Purata (GPS)</th>
                                    <th class="p-4 text-center">Kadar Kelulusan (%)</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${gabunganHTML}
                            </tbody>
                        </table>
                    </div>
                </div>`;
            }

            container.innerHTML = `
            <div class="space-y-6">
                <!-- Header Info -->
                <div class="bg-slate-900 p-8 rounded-3xl shadow-lg border border-slate-800 text-white relative overflow-hidden">
                    <div class="absolute top-0 right-0 p-8 text-white opacity-5">
                        <i data-lucide="bar-chart-3" style="width: 150px; height: 150px;"></i>
                    </div>
                    <div class="relative z-10 space-y-2">
                        <span class="bg-indigo-500 text-white text-[10px] px-3 py-1 rounded-full font-bold uppercase tracking-wider">KONSOL ANALISIS AKADEMIK</span>
                        <h1 class="text-3xl font-black mb-1 tracking-tight">Analisis Keputusan Sekolah</h1>
                        <p class="opacity-80 max-w-2xl text-sm leading-relaxed">
                            Analisis menyeluruh bagi memantau prestasi individu, kelas, serta gabungan GPS keseluruhan sekolah merentasi ketiga-tiga saringan ujian utama.
                        </p>
                    </div>
                </div>

                ${innerHTML}
            </div>`;
            
            lucide.createIcons();
        }

        // --- REALTIME SCORE & GRADE CALCULATIONS ---
        function updateRowGrade(inputElement, studentId) {
            const rawScore = inputElement.value.trim();
            const rowElement = inputElement.closest('tr');
            const gradeSpan = rowElement.querySelector('.row-grade');
            const totalCell = rowElement.querySelector('.row-total');
            
            const gradeInfo = calculateUASAGrade(rawScore);

            if (gradeSpan) {
                gradeSpan.className = `row-grade px-3 py-1.5 rounded-full text-xs font-extrabold border ${gradeInfo.color}`;
                gradeSpan.innerText = `${gradeInfo.grade} (${gradeInfo.label})`;
            }

            if (totalCell) {
                totalCell.innerText = rawScore !== '' ? `${rawScore}/100` : '-';
            }
        }

        // Set up Lucide Icons on launch
        lucide.createIcons();
    </script>
</body>
</html>
