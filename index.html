        // --- FUNGSI LOGIN ---
        function handleLogin(type) {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('login-error');

            errorDiv.classList.add('hidden');

            if (!email || !password) {
                showError('Sila masukkan emel dan kata laluan.');
                return;
            }

            if (!email.endsWith('@moe-dl.edu.my')) {
                showError('Sila gunakan emel DELIMa yang sah (@moe-dl.edu.my)');
                return;
            }

            const list = type === 'admin' ? SenaraiPengguna.admin : SenaraiPengguna.guru;
            const found = list.find(u => u.email === email && u.password === password);

            if (found) {
                currentUser = { 
                    ...found, 
                    role: type === 'admin' ? 'Admin' : (type === 'guru_kelas' ? 'Guru Kelas' : 'Guru') 
                };
                isAdmin = type === 'admin';
                showApp();
                showToast(`Log masuk berjaya sebagai ${currentUser.role}: ${currentUser.name}!`, 'success');
            } else {
                showError(`Kredensial ${type === 'admin' ? 'Admin' : (type === 'guru_kelas' ? 'Guru Kelas' : 'Guru')} tidak sah.`);
            }
        }

        function showError(msg) {
            const errorDiv = document.getElementById('login-error');
            errorDiv.innerText = msg;
            errorDiv.classList.remove('hidden');
        }

        function handleLogout() {
            currentUser = null;
            document.getElementById('login-page').classList.remove('hidden');
            document.getElementById('app-container').classList.add('hidden');
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
            showToast('Anda telah log keluar sistem.', 'info');
        }

        function showApp() {
            document.getElementById('login-page').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');
            
            document.getElementById('user-name-display').innerText = currentUser.name;
            document.getElementById('user-role-display').innerText = currentUser.role;
            const avatar = document.getElementById('user-avatar');
            avatar.innerText = currentUser.name.charAt(0);
            
            let avatarBg = 'bg-emerald-500';
            if (isAdmin) avatarBg = 'bg-slate-800';
            else if (currentUser.role === 'Guru Kelas') avatarBg = 'bg-teal-600';
            avatar.className = `w-10 h-10 rounded-full flex items-center justify-center text-white font-bold shadow-sm ${avatarBg}`;

            }

            } else {

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const bgClasses = {
                success: 'bg-emerald-600 border-emerald-500 text-white',
                danger: 'bg-rose-600 border-rose-500 text-white',
                info: 'bg-slate-800 border-slate-700 text-white',
                warning: 'bg-amber-500 border-amber-400 text-slate-900'
            };

            const iconMap = {
                success: 'check-circle-2',
                danger: 'alert-triangle',
                info: 'info',
                warning: 'alert-circle'
            };

            toast.className = `flex items-center gap-3 px-5 py-3 rounded-2xl shadow-lg border text-sm font-semibold transition-all duration-300 transform translate-y-2 opacity-0 pointer-events-auto ${bgClasses[type]}`;

            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 50);

            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => { toast.remove(); }, 300);
            }, 3500);
        }

        // --- FORMULA PENGGREDAN UASA ---
        function calculateUASAGrade(score) {
            if (score === null || score === undefined || score === '') {
                return { grade: '-', color: 'text-gray-400 bg-gray-50 border-gray-100', label: 'Belum Dinilai' };
            }
            const num = parseFloat(score);
            if (num >= 82 && num <= 100) {
                return { grade: 'A', color: 'text-emerald-700 bg-emerald-50 border-emerald-200', label: 'CEMERLANG' };
            }
            if (num >= 66 && num <= 81) {
                return { grade: 'B', color: 'text-cyan-700 bg-cyan-50 border-cyan-200', label: 'KEPUJIAN' };
            }
            if (num >= 50 && num <= 65) {
                return { grade: 'C', color: 'text-amber-700 bg-amber-50 border-amber-200', label: 'MEMUASKAN' };
            }
            if (num >= 35 && num <= 49) {
                return { grade: 'D', color: 'text-orange-700 bg-orange-50 border-orange-200', label: 'MENCAPAI TAHAP MINIMUM' };
            }
            if (num >= 1 && num <= 34) {
                return { grade: 'E', color: 'text-rose-700 bg-rose-50 border-rose-200', label: 'BELUM MENCAPAI TAHAP MINIMUM' };
            }
            if (num === 0) {
                return { grade: 'F', color: 'text-red-700 bg-red-100 border-red-300', label: 'TIDAK MENGUASAI' };
            }
            return { grade: '-', color: 'text-gray-400 bg-gray-50 border-gray-100', label: 'Belum Dinilai' };
        }

        // --- SIMPAN DAN HANTAR MARKAH ---
        function saveMarks() {
            const rows = document.querySelectorAll('.student-row');
            let successCount = 0;

            rows.forEach(row => {
                const sId = row.getAttribute('data-id');
                const markInput = row.querySelector('.mark-input');
                const pbdSelect = row.querySelector('.pbd-select');

                if (markInput) {
                    const markVal = markInput.value.trim();
                    const key = `${sId}_${selectedYear}_${selectedAssessment}_${selectedSubject}`;
                    
                    if (markVal === '') {
                        delete studentMarks[key];
                    } else {
                        const num = parseFloat(markVal);
                        if (!isNaN(num) && num >= 0 && num <= 100) {
                            studentMarks[key] = num;
                            successCount++;
                        }
                    }

                    if (pbdSelect) {
                        const pbdVal = pbdSelect.value;
                        if (pbdVal) {
                            studentPBD[key] = pbdVal;
                        } else {
                            delete studentPBD[key];
                        }
                    }
                }
            });

            showToast(`Berjaya menyimpan ${successCount} rekod markah secara tempatan.`, 'success');
            renderPage();
        }

        function handleCSVImport(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                const lines = text.split(/\r?\n/);
                let successCount = 0;
                let skipCount = 0;

                lines.forEach((line, index) => {
                    if (!line.trim()) return;

                    const cols = line.split(',');
                    if (index === 0 && (line.toLowerCase().includes('nama') || line.toLowerCase().includes('ic') || line.toLowerCase().includes('kelas'))) {
                        return;
                    }

                    if (cols.length >= 3) {
                        const nama = cols[0].trim().toUpperCase();
                        const ic = cols[1].trim();
                        const kelas = cols[2].trim().toUpperCase();

                        if (nama && ic && kelas) {
                            if (classes.includes(kelas)) {
                                const exists = students.some(s => s.ic === ic);
                                if (!exists) {
                                    const newId = students.length > 0 ? Math.max(...students.map(s => s.id)) + 1 : 1;
                                    students.push({ id: newId, nama, ic, kelas });
                                    successCount++;
                                } else {
                                    skipCount++;
                                }
                            } else {
                                skipCount++;
                            }
                        } else {
                            skipCount++;
                        }
                    } else {
                        skipCount++;
                    }
                });

                if (successCount > 0) {
                    showToast(`Berjaya mengimport ${successCount} murid dari fail CSV!`, 'success');
                }
                if (skipCount > 0) {
                    showToast(`${skipCount} rekod diabaikan (format salah / kelas tidak sepadan / kad pengenalan pendua).`, 'warning');
                }

                event.target.value = '';
                renderPage();
            };
            reader.readAsText(file);
        }

        // --- PADAM MURID (PINDAH SEKOLAH) ---
        function deleteStudent(id) {
            const idx = students.findIndex(s => s.id === id);
            if (idx !== -1) {
                const studentName = students[idx].nama;
                students.splice(idx, 1);
                
                for (const key in studentMarks) {
                    if (key.startsWith(`${id}_`)) delete studentMarks[key];
                }
                for (const key in studentPBD) {
                    if (key.startsWith(`${id}_`)) delete studentPBD[key];
                }
                
                showToast(`Murid [${studentName}] telah berjaya dipadamkan daripada SMM.`, 'info');
                renderPage();
            }
        }

        // --- SUBJEK AKTIF DINAMIK MENGIKUT TAHUN ---
        function getActiveSubjects(classYear) {
            // Tahun 4, 5, 6 mempunyai Sejarah dan RBT (11 subjek). Tahun 1, 2, 3 hanya 9 subjek asas.
            if (classYear >= 4) {
                const active = [...baseSubjects];
                const arabIndex = active.indexOf('BAHASA ARAB');
                if (arabIndex !== -1) {
                    active.splice(arabIndex + 1, 0, 'SEJARAH');
                } else {
                    active.push('SEJARAH');
                }
                active.push('REKA BENTUK TEKNOLOGI');
                return active;
            } else {
                return baseSubjects;
            }
        }

        // --- KIRA KEDUDUKAN MURID ---
        function getClassRankings(targetClass, targetAssessment) {
            const classStudents = students.filter(s => s.kelas === targetClass);
            const classYear = parseInt(targetClass.charAt(0)) || 1;
            const activeSubjects = getActiveSubjects(classYear);

            const performances = classStudents.map(s => {
                let totalMarks = 0;
                let count = 0;
                activeSubjects.forEach(sub => {
                    const key = `${s.id}_${selectedYear}_${targetAssessment}_${sub}`;
                    const score = studentMarks[key];
                    if (score !== undefined) {
                        totalMarks += score;
                        count++;
                    }
                });
                const percentage = count > 0 ? Math.round((totalMarks / (count * 100)) * 100) : 0;
                return {
                    id: s.id,
                    totalMarks: totalMarks,
                    percentage: percentage
                };
            });

            performances.sort((a, b) => b.percentage - a.percentage || b.totalMarks - a.totalMarks);

            const rankings = {};
            performances.forEach((p, index) => {
                rankings[p.id] = index + 1;
            });
            return rankings;
        }

            else if (currentPage === 'guru_kelas_dashboard') {

            // 4. DATA MURID (ADMIN)
            else if (currentPage === 'data_murid') {

                container.innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    
                    <!-- ADMIN: PILIHAN MUAT NAIK DAN BORANG MANUAL -->
                    <div class="space-y-6 lg:col-span-1">
                        
                        <!-- 1. CSV Bulk Upload -->

                            <div class="space-y-2">
                                <label class="block w-full border-2 border-dashed border-emerald-200 hover:border-emerald-500 bg-emerald-50/10 hover:bg-emerald-50/30 p-4 rounded-xl text-center cursor-pointer transition-all">
                                    <i data-lucide="file-spreadsheets" class="w-8 h-8 text-emerald-600 mx-auto mb-2"></i>

                                    <span class="text-[10px] text-gray-400">Pastikan format UTF-8</span>

                                </label>
                            </div>

                        <!-- 2. Borang Manual Pendaftaran Murid (Ditambah Butang Simpan + Modal Konfirmasi Kustom) -->
                        <div class="bg-white p-6 rounded-3xl border border-emerald-100 shadow-sm space-y-4">
                            <h4 class="font-bold text-gray-800 text-base flex items-center gap-2">
                                <i data-lucide="user-plus" class="text-emerald-600 w-5 h-5"></i> Pendaftaran Manual
                            </h4>
                            <form onsubmit="handleManualRegisterSubmit(event)" class="space-y-4">
                                <div class="space-y-1.5">
                                    <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Nama Penuh Murid</label>
                                    <input id="admin-reg-nama" type="text" required class="w-full p-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none text-xs font-semibold uppercase" placeholder="Contoh: FARHAN BIN NAZRI">
                                </div>
                                <div class="space-y-1.5">
                                    <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">No. Kad Pengenalan / IC</label>
                                    <input id="admin-reg-ic" type="text" required class="w-full p-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none text-xs font-semibold" placeholder="Contoh: 140301-01-0101">
                                </div>
                                <div class="space-y-1.5">
                                    <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Kelas Pilihan</label>
                                    <select id="admin-reg-kelas" class="w-full p-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none text-xs font-bold bg-white text-gray-700">
                                        ${classes.map(c => `<option value="${c}">${c}</option>`).join('')}
                                    </select>
                                </div>
                                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl transition-all shadow-md flex items-center justify-center gap-2 text-xs">
                                    <i data-lucide="save" class="w-4 h-4"></i> Simpan Nama Murid
                                </button>
                            </form>
                        </div>

                    </div>

                    <!-- Senarai Murid Berdaftar -->
                    <div class="lg:col-span-2 bg-white rounded-3xl border border-gray-100 shadow-sm overflow-hidden">
                        <div class="p-6 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
                            <h4 class="font-bold text-slate-800 text-lg flex items-center gap-2">
                                <i data-lucide="users" class="text-slate-600 w-5 h-5"></i> Senarai Murid Berdaftar SMM
                            </h4>
                            <span class="text-xs font-bold bg-slate-100 text-slate-800 px-3 py-1 rounded-full uppercase">
                                Jumlah: ${students.length} Murid

                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left min-w-[500px]">
                                <thead>
                                    <tr class="bg-gray-50 text-slate-500 text-xs uppercase font-bold border-b border-gray-100">
                                        <th class="p-4 w-16">ID</th>
                                        <th class="p-4">Nama Penuh</th>
                                        <th class="p-4">No. Kad Pengenalan</th>
                                        <th class="p-4">Kelas</th>
                                        <th class="p-4 text-right">Tindakan</th>
                                    </tr>
                                </thead>
                                <tbody>

                            </table>

            else if (currentPage === 'laporan_uasa') {
                container.innerHTML = renderComprehensiveMonitoringTable(true);

            // 6. MODUL ANALISIS (ADMIN & GURU KELAS)
            else if (currentPage === 'analisis') {
                renderAnalysisPage();

            // 7. TETAPAN (SETTINGS)
            else if (currentPage === 'settings') {
                container.innerHTML = `
                <div class="max-w-3xl space-y-8">
                    <div class="bg-white p-8 rounded-2xl border border-emerald-100 shadow-sm space-y-6">
                        <h4 class="font-bold text-gray-800 text-xl flex items-center gap-2 border-b border-gray-100 pb-4">
                            <i data-lucide="sliders" class="text-emerald-600 w-6 h-6"></i> Tetapan Profil
                        </h4>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                                <input type="text" readonly disabled value="${currentUser.fullName}" class="w-full p-3 border border-gray-200 rounded-xl bg-gray-50 text-gray-400 outline-none text-sm font-semibold cursor-not-allowed">
                            </div>
                            <div class="space-y-2">
                                <label class="text-sm font-semibold text-gray-700 flex items-center gap-2">Sistem Emel</label>
                                <input type="text" readonly disabled value="${currentUser.email}" class="w-full p-3 border border-gray-200 rounded-xl bg-gray-50 text-gray-400 outline-none text-sm font-semibold cursor-not-allowed">
                            </div>
                        </div>
                    </div>
                </div>`;

            lucide.createIcons();
        }

        // --- CALCULATION UPDATER ---
        function updateRowGrade(inputElement, studentId) {
            const rawScore = inputElement.value.trim();
            const rowElement = inputElement.closest('tr');
            const gradeSpan = rowElement.querySelector('.row-grade');
            const totalCell = rowElement.querySelector('.row-total');
            
            const gradeInfo = calculateUASAGrade(rawScore);

            if (gradeSpan) {
                gradeSpan.className = `row-grade px-3 py-1.5 rounded-full text-xs font-extrabold border ${gradeInfo.color}`;
                gradeSpan.innerText = `${gradeInfo.grade} (${gradeInfo.label})`;
            }

            if (totalCell) {
                totalCell.innerText = rawScore !== '' ? `${rawScore}/100` : '-';
            }
        }

        // Initialize Lucide Icons on launch
        lucide.createIcons();
    </script>

    <script>
        (function() {
            'use strict';

            // 1. SEKATAN KLIK KANAN
            document.addEventListener('contextmenu', function(e) {
                e.preventDefault();
                alert("Amaran: Fungsi klik kanan disekat untuk keselamatan!");
            });

            // 2. SEKATAN PINTASAN PAPAN KEKUNCI
            document.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && (e.key === 'c' || e.key === 'x')) { e.preventDefault(); alert("Fungsi salin disekat!"); return false; }
                if ((e.ctrlKey || e.metaKey) && e.key === 'u') { e.preventDefault(); alert("Akses kod sumber disekat!"); return false; }
                if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); alert("Fungsi simpan disekat!"); return false; }
                if (e.key === 'F12' || ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C'))) { e.preventDefault(); alert("Developer Tools disekat!"); return false; }
            });

            // 3. ANTI-DEBUGGER
            function antiDebug(i) {
                if (("" + i / i).length !== 1 || i % 20 === 0) { (function() {}).constructor("debugger")(); } else { (function() {}).constructor("debugger")(); }
                antiDebug(++i);
            }
            try { setInterval(function() { antiDebug(0); }, 50); } catch (e) {}
        })();
    </script>
