<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Pentaksiran SK Bukit Tongkat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .hidden { display: none; }
    </style>
</head>
<body class="bg-emerald-50/30 min-h-screen">

    <!-- LOGIN PAGE -->
    <div id="login-page" class="min-h-screen bg-emerald-50 flex items-center justify-center p-4">
        <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-emerald-100">
            <div class="bg-emerald-600 p-8 text-white text-center">
              <!-- LOGO SEKOLAH (logo.png dari GitHub/Folder Tempatan) -->
                <div class="bg-white w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg overflow-hidden border-2 border-white">
                    <img src="logo.png" alt="Logo SK Bukit Tongkat" class="w-20 h-20 object-contain" onerror="this.src='https://placehold.co/100x100?text=LOGO'">
                </div>
                <h1 class="text-2xl font-bold uppercase tracking-tight">Sistem Pentaksiran & UASA</h1>
                <p class="opacity-80">SK Bukit Tongkat (JBA2054)</p>
            </div>
            
            <div class="p-8 space-y-6">
                <div id="login-error" class="hidden bg-red-50 text-red-600 p-3 rounded-lg text-sm border border-red-100"></div>
                <form id="login-form" class="space-y-5">
                    <div class="space-y-2">
                        <label class="text-sm font-semibold text-gray-700 flex items-center gap-2">
                            <i data-lucide="user" class="w-4 h-4"></i> Emel DELIMa
                        </label>
                        <input id="email" type="email" required class="w-full p-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none text-sm" placeholder="g-xxxxxxxx@moe-dl.edu.my">
                    </div>
                    <div class="space-y-2">
                        <label class="text-sm font-semibold text-gray-700 flex items-center gap-2">
                            <i data-lucide="lock" class="w-4 h-4"></i> Kata Laluan
                        </label>
                        <input id="password" type="password" required class="w-full p-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none text-sm" placeholder="********">
                    </div>
                    <div class="grid grid-cols-1 gap-3">
                        <button type="button" onclick="handleLogin('guru')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition-all shadow-md">
                            Log Masuk Guru
                        </button>
                        <button type="button" onclick="handleLogin('admin')" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-semibold py-3 rounded-xl transition-all flex items-center justify-center gap-2">
                            <i data-lucide="shield-check" class="w-5 h-5"></i> Admin
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- MAIN APP LAYOUT (HIDDEN BY DEFAULT) -->
    <div id="app-container" class="hidden min-h-screen flex">
        <!-- Sidebar -->
        <aside class="w-64 bg-white border-r border-emerald-100 flex flex-col p-6 shadow-sm shrink-0">
            <div class="flex items-center gap-3 mb-10 px-2">
                <!-- LOGO SEKOLAH KECIL -->
                <div class="bg-white p-1 rounded-lg shadow-sm border border-emerald-100">
                    <img src="logo.png" alt="Logo" class="w-10 h-10 object-contain" onerror="this.src='https://placehold.co/40x40?text=LOGO'">
                </div>
                <span class="font-bold text-gray-800 text-lg uppercase leading-tight">SK Bukit<br/>Tongkat</span>
            </div>
            
            <nav id="nav-menu" class="space-y-2 flex-grow">
                <!-- Navigation Items dynamically rendered here -->
            </nav>

            <div class="mt-auto pt-6 border-t border-emerald-50">
                <div class="flex items-center gap-3 mb-4 px-2">
                    <div id="user-avatar" class="w-10 h-10 rounded-full flex items-center justify-center text-white font-bold shadow-sm"></div>
                    <div class="overflow-hidden">
                        <p id="user-name-display" class="text-sm font-bold text-gray-800 truncate"></p>
                        <p id="user-role-display" class="text-[10px] font-bold uppercase text-gray-400"></p>
                    </div>
                </div>
                <button onclick="handleLogout()" class="w-full flex items-center gap-3 px-4 py-2 text-red-500 hover:bg-red-50 rounded-xl transition-all font-semibold text-sm">
                    <i data-lucide="log-out" class="w-4 h-4"></i> Log Keluar
                </button>
            </div>
        </aside>

        <!-- Content Area -->
        <main class="flex-grow flex flex-col h-screen overflow-hidden">
            <header class="h-16 bg-white border-b border-emerald-100 flex items-center justify-between px-8 shrink-0 shadow-sm z-10">
                <h2 id="page-title" class="font-bold text-gray-800 text-xl capitalize">Dashboard</h2>
                <div id="admin-indicator" class="hidden">
                    <span class="bg-slate-800 text-white text-[10px] px-2 py-1 rounded font-bold uppercase tracking-wider">Admin Mode</span>
                </div>
            </header>

            <div id="page-content" class="p-8 overflow-y-auto flex-grow">
                <!-- Page Content dynamically rendered here -->
            </div>
        </main>
    </div>

    <script>
        // --- DATA & STATE ---
        const SenaraiPengguna = {
            guru: [
                {
                    email: 'g-81430999@moe-dl.edu.my',
                    password: 'jba2054',
                    name: 'KHAIRULAZMAN',
                    fullName: 'KHAIRULAZMAN BIN DOLLAH'
                },
                {
                    email: 'g-10027730@moe-dl.edu.my',
                    password: 'jba2054',
                    name: 'DAYANG NURFARAHAIN FAEEZA',
                    fullName: 'DAYANG NURFARAHAIN FAEEZA BINTI HASSIM'
                }
            ],
            admin: [
                {
                    email: 'admin@moe-dl.edu.my',
                    password: 'admin123',
                    name: 'PENTADBIR SISTEM',
                    fullName: 'ADMINISTRATOR SKBT'
                },
                 {
                    email: 'g-12016529@moe-dl.edu.my',
                    password: 'jba2054',
                    name: 'PSPA LAILA',
                    fullName: 'PSPA LAILA BINTI OTHMAN'
                }
            ]
        };

        const students = [
            { id: 1, nama: 'Ahmad bin Zulkifli', kelas: '6 Arif' },
            { id: 2, nama: 'Siti Nurhaliza binti Ramli', kelas: '6 Arif' },
            { id: 3, nama: 'Chong Wei Han', kelas: '6 Arif' }
        ];

        let currentUser = null;
        let isAdmin = false;
        let currentPage = 'dashboard';

        // --- AUTH FUNCTIONS ---
        function handleLogin(type) {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('login-error');

            errorDiv.classList.add('hidden');

            if (!email || !password) {
                showError('Sila masukkan emel dan kata laluan.');
                return;
            }

            if (!email.endsWith('@moe-dl.edu.my')) {
                showError('Sila gunakan emel DELIMa yang sah (@moe-dl.edu.my)');
                return;
            }

            const list = type === 'admin' ? SenaraiPengguna.admin : SenaraiPengguna.guru;
            const found = list.find(u => u.email === email && u.password === password);

            if (found) {
                currentUser = { ...found, role: type === 'admin' ? 'Admin' : 'Guru' };
                isAdmin = type === 'admin';
                showApp();
            } else {
                showError(`Kredensial ${type === 'admin' ? 'Admin' : 'Guru'} tidak sah.`);
            }
        }

        function showError(msg) {
            const errorDiv = document.getElementById('login-error');
            errorDiv.innerText = msg;
            errorDiv.classList.remove('hidden');
        }

        function handleLogout() {
            currentUser = null;
            document.getElementById('login-page').classList.remove('hidden');
            document.getElementById('app-container').classList.add('hidden');
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
        }

        // --- NAVIGATION ---
        function showApp() {
            document.getElementById('login-page').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');
            
            // Set User Info
            document.getElementById('user-name-display').innerText = currentUser.name;
            document.getElementById('user-role-display').innerText = currentUser.role;
            const avatar = document.getElementById('user-avatar');
            avatar.innerText = currentUser.name.charAt(0);
            avatar.className = `w-10 h-10 rounded-full flex items-center justify-center text-white font-bold shadow-sm ${isAdmin ? 'bg-slate-800' : 'bg-emerald-500'}`;

            if (isAdmin) {
                document.getElementById('admin-indicator').classList.remove('hidden');
            } else {
                document.getElementById('admin-indicator').classList.add('hidden');
            }

            renderMenu();
            navigate('dashboard');
        }

        function renderMenu() {
            const menu = document.getElementById('nav-menu');
            let html = `<button onclick="navigate('dashboard')" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all" data-page="dashboard">
                <i data-lucide="layout-dashboard"></i><span>Dashboard</span>
            </button>`;

            if (isAdmin) {
                html += `
                <button onclick="navigate('data_murid')" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all" data-page="data_murid">
                    <i data-lucide="users"></i><span>Data Murid</span>
                </button>
                <button onclick="navigate('pentaksiran_1')" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all" data-page="pentaksiran_1">
                    <i data-lucide="clipboard-list"></i><span>Pentaksiran 1</span>
                </button>
                <button onclick="navigate('uasa')" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all" data-page="uasa">
                    <i data-lucide="file-spreadsheet"></i><span>UASA</span>
                </button>`;
            } else {
                html += `
                <button onclick="navigate('pengisian_markah')" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all" data-page="pengisian_markah">
                    <i data-lucide="book-open"></i><span>Pengisian Markah</span>
                </button>`;
            }

            html += `
            <button onclick="navigate('settings')" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all" data-page="settings">
                <i data-lucide="settings"></i><span>Tetapan</span>
            </button>`;

            menu.innerHTML = html;
            lucide.createIcons();
        }

        function navigate(pageId) {
            currentPage = pageId;
            document.getElementById('page-title').innerText = pageId.replace('_', ' ');
            
            // Update Active Class
            document.querySelectorAll('.nav-btn').forEach(btn => {
                if (btn.getAttribute('data-page') === pageId) {
                    btn.classList.add('bg-emerald-50', 'text-emerald-700', 'font-bold');
                    btn.classList.remove('text-gray-500');
                } else {
                    btn.classList.remove('bg-emerald-50', 'text-emerald-700', 'font-bold');
                    btn.classList.add('text-gray-500');
                }
            });

            renderPage();
        }

        // --- RENDER PAGES ---
        function renderPage() {
            const container = document.getElementById('page-content');
            
            if (currentPage === 'dashboard') {
                container.innerHTML = `
                <div class="space-y-8">
                    <div class="bg-white p-8 rounded-3xl shadow-sm border border-emerald-100 relative overflow-hidden">
                        <div class="absolute top-0 right-0 p-8 text-emerald-50 opacity-10">
                            <i data-lucide="graduation-cap" style="width: 120px; height: 120px;"></i>
                        </div>
                        <div class="relative z-10">
                            <h1 class="text-2xl font-black text-gray-800 mb-1">
                                Selamat Datang ${currentUser.fullName}
                            </h1>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-emerald-50">
                            <p class="text-gray-400 text-xs font-bold uppercase tracking-wider mb-1">Status Sistem</p>
                            <div class="flex items-center gap-2">
                                <div class="w-2 h-2 rounded-full bg-emerald-500"></div>
                                <h3 class="text-2xl font-bold text-emerald-600">Aktif</h3>
                            </div>
                        </div>
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-emerald-50">
                            <p class="text-gray-400 text-xs font-bold uppercase tracking-wider mb-1">Sesi Akademik</p>
                            <h3 class="text-2xl font-bold text-gray-800">2026/2027</h3>
                        </div>
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-emerald-50">
                            <p class="text-gray-400 text-xs font-bold uppercase tracking-wider mb-1">ID Sekolah</p>
                            <h3 class="text-2xl font-bold text-gray-800">JBA2054</h3>
                        </div>
                    </div>
                </div>`;
            } 
            else if (currentPage === 'pengisian_markah') {
                let rows = students.map(s => `
                    <tr class="hover:bg-emerald-50/20 border-b border-emerald-50 transition-colors">
                        <td class="p-4 text-sm font-semibold text-gray-700 uppercase">${s.nama}</td>
                        <td class="p-4 text-center">
                            <input type="number" class="w-20 p-2 text-center bg-gray-50 rounded-lg border border-gray-100 focus:ring-2 focus:ring-emerald-200 outline-none font-bold" placeholder="0">
                        </td>
                        <td class="p-4 text-right">
                            <button class="text-emerald-600 hover:bg-emerald-50 p-2 rounded-lg"><i data-lucide="save"></i></button>
                        </td>
                    </tr>
                `).join('');

                container.innerHTML = `
                <div class="bg-white rounded-2xl shadow-sm border border-emerald-50 overflow-hidden">
                    <div class="p-6 border-b flex justify-between items-center bg-emerald-50/10">
                        <div><h4 class="font-bold text-gray-800">Markah Murid</h4></div>
                        <select class="bg-emerald-600 text-white rounded-lg px-4 py-2 text-sm font-bold"><option>Tahun 6 Arif</option></select>
                    </div>
                    <table class="w-full text-left">
                        <thead><tr class="bg-emerald-50/50 text-emerald-700 text-[11px] uppercase font-bold"><th class="p-4">Nama</th><th class="p-4 text-center">Markah (%)</th><th class="p-4 text-right">Aksi</th></tr></thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>`;
            }
            else {
                container.innerHTML = `<div class="bg-white rounded-3xl p-12 text-center border border-emerald-100 shadow-sm">
                    <div class="w-20 h-20 bg-emerald-50 rounded-2xl flex items-center justify-center mx-auto mb-4 text-emerald-600">
                        <i data-lucide="settings" class="w-10 h-10"></i>
                    </div>
                    <h3 class="text-xl font-bold text-gray-800">Halaman Sedang Dikemaskini</h3>
                    <p class="text-gray-500">Modul ini akan tersedia tidak lama lagi.</p>
                </div>`;
            }
            
            lucide.createIcons();
        }

        // Initialize Icons for Login Page
        lucide.createIcons();
    </script>
</body>
</html>
